name: BizBuySell Scraper

on:
  schedule:
    - cron: "0 * * * *"   # every hour at :00
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to commit seen_listings.json back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # Optional overrides — set these as repo secrets or remove to use defaults
          PRICE_MIN: ${{ vars.PRICE_MIN }}
          PRICE_MAX: ${{ vars.PRICE_MAX }}
          CF_MIN: ${{ vars.CF_MIN }}
          CF_MAX: ${{ vars.CF_MAX }}
          LOCATION_FILTER: ${{ vars.LOCATION_FILTER }}
          KEYWORD_FILTER: ${{ vars.KEYWORD_FILTER }}
        run: python scraper.py

      - name: Commit updated seen_listings.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_listings.json
          git diff --cached --quiet || git commit -m "chore: update seen listings [skip ci]"
          git push
